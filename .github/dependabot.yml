# Weekly dependency and Actions updates, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github_actions:
        patterns: ["*"]
